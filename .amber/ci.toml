# amber-ci jobs for social-graph-client (spec: stackwell-labs/amber-ci
# docs/design.md §2; onboarding: docs/onboarding.md there).
#
# Equivalent to .github/workflows/test.yml, which runs on every push and PR:
#   test.yml `test` (cargo test, then cargo check --tests) -> test
#
# GitHub installs floating `stable` Rust; this pins 1.97.0, the platform
# toolchain, by digest (the one other Stackwell specs use).
#
# Not hermetic, and so no `reuse`: Cargo.lock is gitignored (a library), so
# every run resolves dependencies afresh from crates.io, as GitHub does. The
# result is then not a function of the tree, which reuse requires. The runner's
# `git clean -ffdx` drops the generated lock between runs. No git deps.

version = 1

[job.test]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
run = [
  "cargo test --no-fail-fast",
  "cargo check --tests",
]
required_for_main = true
timeout_minutes = 30
cache = "rust-1.97.0"

[job.test.env]
CARGO_HOME = "/cache/cargo"
CARGO_TARGET_DIR = "/cache/target"
